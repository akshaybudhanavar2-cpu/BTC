version: 2

sources:
  - name: DEV
    database: BTC
    schema: DEV
    tables:
      - name: BTC_TXN_SRC     

  - name: STAGE
    database: BTC
    schema: STAGE
    tables:
      - name: BTC_TXN
        config:
          loaded_at_field: block_timestamp
          freshness:
            warn_after:
              count: 1
              period: hour
            error_after:
              count: 2
              period: hour
        columns:
          - name: FEE
            tests:
              - not_null
              - unique
          - name: INPUT_VALUE
            tests:
              - not_null
              - unique
     